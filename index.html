    body { font-family: 'Noto Sans JP', sans-serif; }
    html { -webkit-text-size-adjust: 100%; }

    @media (orientation: landscape) and (max-width: 767px) {
      .title-line,
      .title-line *{

    @media print {

      .print-only { display: block !important; margin: 0 0 6mm 0; }

    .scrollbar-hide::-webkit-scrollbar { display: none; }

    .editable {

    }
    .editable:hover { background-color: #f8fafc; outline: 1px dashed #cbd5e1; }
    .editable:focus { background-color: white; outline: 2px solid #3b82f6; }

    .readonly {

      user-select: text;
      background-color: transparent !important;
      outline: none !important;
    }
    .readonly:hover { outline: none !important; background-color: transparent !important; }

  <script>
    // ========= 状態 =========
    let scheduleData = [];
    let currentMonth = 4;
    let currentTab = 'all';
    let globalSearchQuery = '';

    // ========= Firebase =========
    let firebaseReady = false;
    let db = null;
    let authUser = null;

    const LAST_ID_KEY = 'schedule_last_id_v1';
    const TOOLS_COLLAPSED_KEY = 'schedule_tools_collapsed_v1';
    const LAST_MONTH_KEY = 'schedule_last_month_v1';
    const LAST_SEEN_KEY_PREFIX = 'schedule_last_seen_millis_v1__';
    const LOCAL_CACHE_PREFIX = 'schedule_cache_v1__';
    const FIXED_CREATE_CODE = '20136684';

    // モード：閲覧/編集
    let canEdit = false;

    // ================================
    // 保存（カード単位 / dirty管理）
    // ================================
    const _saveTimers = new Map();
    const _pendingItemIds = new Set();
    const _baseValue = new Map();
    const _dirtyKeys = new Set();
    const _itemDirtyCount = new Map();
    const _savingItems = new Set();
    const _needsResaveItems = new Set();

    // ★追加：itemごとに「どのfieldがdirtyか」を保持（閲覧モードのチェック保存判定に使う）
    const _dirtyFieldsByItem = new Map(); // itemId => Set(fields)

    function _k(id, field) { return `${id}__${field}`; }

    function norm(v) {
      return String(v ?? '').replace(/\r\n/g, '\n').trim();
    }

    function markDirty(id, field) {
      const key = _k(id, field);
      if (_dirtyKeys.has(key)) return;
      _dirtyKeys.add(key);
      _itemDirtyCount.set(id, (_itemDirtyCount.get(id) || 0) + 1);
      _pendingItemIds.add(id);

      let s = _dirtyFieldsByItem.get(id);
      if (!s) { s = new Set(); _dirtyFieldsByItem.set(id, s); }
      s.add(field);
    }

    function clearDirty(id, field) {
      const key = _k(id, field);
      if (!_dirtyKeys.has(key)) return;
      _dirtyKeys.delete(key);

      const n = (_itemDirtyCount.get(id) || 0) - 1;
      if (n <= 0) _itemDirtyCount.delete(id);
      else _itemDirtyCount.set(id, n);

      const s = _dirtyFieldsByItem.get(id);
      if (s) {
        s.delete(field);
        if (s.size === 0) _dirtyFieldsByItem.delete(id);
      }

      if (!hasDirtyForItem(id) && !_saveTimers.has(id)) {
        _pendingItemIds.delete(id);
      }
    }

    function hasDirtyForItem(id) {
      return (_itemDirtyCount.get(id) || 0) > 0;
    }

    function setBaselineFromCurrent(id, field, value) {
      const key = _k(id, field);
      _baseValue.set(key, norm(value));
    }

    // ★祝日を追加
    function _fields() {
      return ['notice', 'duty', 'events', 'business', 'submission', 'vacation', 'holiday'];
    }

    // ================================
    // ★祝日（自動生成＋手入力上書き）
    // ================================
    function _pad2(n) { return String(n).padStart(2, '0'); }
    function ymdKey(y, m, d) { return `${y}-${_pad2(m)}-${_pad2(d)}`; }
    function _dateKey(dt) { return `${dt.getFullYear()}-${_pad2(dt.getMonth() + 1)}-${_pad2(dt.getDate())}`; }

    // N回目の曜日（例：第2月曜）
    function nthWeekdayOfMonth(year, month, weekday, nth) {
      // weekday: 0=日 ... 6=土
      const first = new Date(year, month - 1, 1);
      const firstDow = first.getDay();
      const delta = (weekday - firstDow + 7) % 7;
      const day = 1 + delta + 7 * (nth - 1);
      return day;
    }

    // 春分・秋分（概算式：1980年基準）
    function calcVernalEquinoxDay(year) {
      return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    }
    function calcAutumnalEquinoxDay(year) {
      return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    }

    function getJapaneseHolidays(year) {
      const H = new Map();
      const add = (m, d, name) => H.set(ymdKey(year, m, d), name);

      // 固定
      add(1, 1, '元日');
      add(2, 11, '建国記念の日');
      add(2, 23, '天皇誕生日');
      add(4, 29, '昭和の日');
      add(5, 3, '憲法記念日');
      add(5, 4, 'みどりの日');
      add(5, 5, 'こどもの日');
      add(8, 11, '山の日');
      add(11, 3, '文化の日');
      add(11, 23, '勤労感謝の日');

      // ハッピーマンデー
      add(1, nthWeekdayOfMonth(year, 1, 1, 2), '成人の日');           // 第2月曜
      add(7, nthWeekdayOfMonth(year, 7, 1, 3), '海の日');             // 第3月曜
      add(9, nthWeekdayOfMonth(year, 9, 1, 3), '敬老の日');           // 第3月曜
      add(10, nthWeekdayOfMonth(year, 10, 1, 2), 'スポーツの日');     // 第2月曜

      // 春分・秋分
      add(3, calcVernalEquinoxDay(year), '春分の日');
      add(9, calcAutumnalEquinoxDay(year), '秋分の日');

      // 振替休日（祝日が日曜なら次の平日へ繰り下げ）
      const baseKeys = Array.from(H.keys()).sort();
      for (const k of baseKeys) {
        const [y, m, d] = k.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        if (dt.getDay() === 0) {
          const nd = new Date(dt);
          nd.setDate(nd.getDate() + 1);
          while (H.has(_dateKey(nd))) nd.setDate(nd.getDate() + 1);
          H.set(_dateKey(nd), '振替休日');
        }
      }

      // 国民の休日（祝日に挟まれた平日）
      for (let dt = new Date(year, 0, 1); dt.getFullYear() === year; dt.setDate(dt.getDate() + 1)) {
        const k = _dateKey(dt);
        if (H.has(k)) continue;
        const dow = dt.getDay();
        if (dow === 0 || dow === 6) continue; // 土日除外

        const prev = new Date(dt); prev.setDate(prev.getDate() - 1);
        const next = new Date(dt); next.setDate(next.getDate() + 1);
        const pk = _dateKey(prev);
        const nk = _dateKey(next);
        if (H.has(pk) && H.has(nk)) {
          H.set(k, '国民の休日');
        }
      }

      return H;
    }

    function _classifyChecklistLine(lineRaw) {
      const line = String(lineRaw ?? '');
      const t = line.replace(/^\s+/, '');
      const t2 = t.replace(/^[-*・●•\u2022]\s*/, '');
      const unchecked = /^(?:\[\s?\]|☐|□|⬜|◻︎|▫️|◻|🔲)\b/.test(t2);
      const checked = /^(?:\[(?:x|X|✓|✔)\]|☑|✅|✔|✓|■|🗹|🔳)\b/.test(t2);
      if (checked) return 2;
      if (unchecked) return 1;
      return 0;
    }

    function sortChecklistText(text) {
      const original = String(text ?? '');
      const s = original.replace(/\r\n/g, '\n');
      const lines = s.split('\n');

      let hasChecklist = false;
      for (const ln of lines) {
        const c = _classifyChecklistLine(ln);
        if (c === 1 || c === 2) { hasChecklist = true; break; }
      }
      if (!hasChecklist || lines.length <= 1) return original;

      const tagged = lines.map((ln, idx) => ({ ln, idx, grp: _classifyChecklistLine(ln) }));
      tagged.sort((a, b) => (a.grp - b.grp) || (a.idx - b.idx));

      const sorted = tagged.map(x => x.ln).join('\n');
      return sorted === s ? original : sorted;
    }

    async function loadCloudForYear({ initialFull = false } = {}) {
      if (!authUser) return { updatedCount: 0, changed: false };
      const ok = await ensureFirebase();
      if (!ok) return { updatedCount: 0, changed: false };

      const startYear = getStartYear();
      const ref = cloudDaysRef(startYear);

      setSyncBadge('同期中', 'wait');

      const lastSeen = getLastSeenTs(startYear);

      let qref = ref;
      if (!initialFull && lastSeen) {
        qref = ref.where('updatedAt', '>', lastSeen).orderBy('updatedAt', 'asc');
      }

      const snap = await qref.get();

      let updatedCount = snap.size;
      let changed = false;
      let maxTs = lastSeen;

      snap.forEach(doc => {
        const data = doc.data() || {};
        const did = applyCloudDocToLocal(data);
        if (did) changed = true;

        const ts = data.updatedAt;
        if (ts && typeof ts.toMillis === 'function') {
          if (!maxTs || ts.toMillis() > maxTs.toMillis()) maxTs = ts;
        }
      });

      if (initialFull && !maxTs) maxTs = firebase.firestore.Timestamp.fromMillis(Date.now());
      if (maxTs) setLastSeenTs(startYear, maxTs);

      if (changed) {
        if (isEditingCell) pendingRerender = true;
        else renderSchedule();
      }

      try {
        if (initialFull || !lastSeen) {
          const metaSnap = await yearDocRef(startYear).get();
          if (metaSnap.exists) {
            const md = metaSnap.data() || {};
            if (typeof md.schoolName === 'string' && md.schoolName.trim()) {
              document.getElementById('schoolName').innerText = md.schoolName;
            }
          }
        } else {
          const ys = await roomDocRef().collection('years')
            .where('updatedAt', '>', lastSeen)
            .orderBy('updatedAt', 'asc')
            .get();

          ys.forEach(d => {
            if (d.id !== String(startYear)) return;
            const md = d.data() || {};

              document.getElementById('schoolName').innerText = md.schoolName;

          year: item.year, month: item.month, day: item.day,
          notice: '', duty: '', events: '', business: '', submission: '', vacation: '',
          holiday: firebase.firestore.FieldValue.delete(), // ★追加
          isDeleted: true,
          deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedBy: authUser ? authUser.uid : null
        }, { merge: true });
        return;
      }

      await ref.set({
        year: item.year, month: item.month, day: item.day,
        notice, duty, events, business, submission, vacation,
        holiday: hasHolidayOverride ? holidayOverride : firebase.firestore.FieldValue.delete(), // ★追加
        isDeleted: false,
        deletedAt: firebase.firestore.FieldValue.delete(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: authUser ? authUser.uid : null
      }, { merge: true });

    async function batchSaveToCloud(items) {
      if (!authUser) return;
      const ok = await ensureFirebase();
      if (!ok) return;

      const startYear = getStartYear();
      const ref = cloudDaysRef(startYear);

      const batch = db.batch();
      items.forEach(item => {
        const docId = `${item.year}-${item.month}-${item.day}`;

        const notice = (item.notice || '').trim();
        const duty = (item.duty || '').trim();
        const events = (item.events || '').trim();
        const business = (item.business || '').trim();
        const submission = (item.submission || '').trim();
        const vacation = (item.vacation || '').trim();

        const hasHolidayOverride = (typeof item.holiday === 'string');
        const holidayOverride = hasHolidayOverride ? String(item.holiday || '').trim() : null;

        const isEmpty = !notice && !duty && !events && !business && !submission && !vacation && !hasHolidayOverride;

        if (isEmpty) {
          batch.set(ref.doc(docId), {
            year: item.year, month: item.month, day: item.day,
            notice: '', duty: '', events: '', business: '', submission: '', vacation: '',
            holiday: firebase.firestore.FieldValue.delete(),
            isDeleted: true,
            deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedBy: authUser ? authUser.uid : null
          }, { merge: true });
        } else {
          batch.set(ref.doc(docId), {
            year: item.year, month: item.month, day: item.day,
            notice, duty, events, business, submission, vacation,
            holiday: hasHolidayOverride ? holidayOverride : firebase.firestore.FieldValue.delete(),
            isDeleted: false,
            deletedAt: firebase.firestore.FieldValue.delete(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedBy: authUser ? authUser.uid : null
          }, { merge: true });
        }
      });
      await batch.commit();
    }

    // ================================
    // ★差し替え：queueSave（閲覧モードでも submission チェック保存OK）
    // ================================
    function queueSave(id, field, value, opts = {}) {
      const allowViewChecklist = !!opts.allowViewChecklist;

      if (!authUser) return;
      if (!(canEdit || (allowViewChecklist && field === 'submission'))) return;

      resetZoomIfNeeded();

      const item = scheduleData.find(d => d.id === id);
      if (!item) return;

      const key = _k(id, field);

      if (!_baseValue.has(key)) {
        _baseValue.set(key, norm(item[field] || ''));
      }

      const v = norm(value);
      item[field] = v;

      const base = _baseValue.get(key);

      if (v === base) {
        clearDirty(id, field);

        if (!hasDirtyForItem(id)) {
          if (_saveTimers.has(id)) {
            clearTimeout(_saveTimers.get(id));
            _saveTimers.delete(id);
          }
          _pendingItemIds.delete(id);
        }
        return;
      }

      markDirty(id, field);

      const delay = (allowViewChecklist && field === 'submission' && !canEdit) ? 800 : 3000;

      if (_saveTimers.has(id)) clearTimeout(_saveTimers.get(id));
      _saveTimers.set(id, setTimeout(async () => {
        _saveTimers.delete(id);
        await commitSaveItem(id, { sort: false, rerender: false, allowViewChecklist: allowViewChecklist && field === 'submission' });
      }, delay));
    }

    async function flushAllPendingSaves() {
      if (!authUser) {
        _saveTimers.forEach(t => clearTimeout(t));
        _saveTimers.clear();
        _pendingItemIds.clear();
        _dirtyKeys.clear();
        _itemDirtyCount.clear();
        _dirtyFieldsByItem.clear();
        return;
      }

      _saveTimers.forEach(t => clearTimeout(t));
      _saveTimers.clear();

      const ids = Array.from(_pendingItemIds);
      _pendingItemIds.clear();

      const items = [];
      let anySorted = false;

      ids.forEach(itemId => {
        if (!hasDirtyForItem(itemId)) return;

        if (!canEdit) {
          const s = _dirtyFieldsByItem.get(itemId);
          if (!s || s.size === 0) return;
          for (const f of s) { if (f !== 'submission') return; }
        }

        const it = scheduleData.find(d => d.id === itemId);
        if (it) {
          if (sortChecklistInItem(it)) anySorted = true;
          items.push(it);
        }
      });

      if (items.length > 0) {
        try {
          await batchSaveToCloud(items);

          items.forEach(it => {
            _fields().forEach(f => {
              _baseValue.set(_k(it.id, f), norm(it[f] || ''));
              clearDirty(it.id, f);
            });
            _pendingItemIds.delete(it.id);
            if (_saveTimers.has(it.id)) {
              clearTimeout(_saveTimers.get(it.id));
              _saveTimers.delete(it.id);
            }
          });

          queueScheduleCacheSave();

          if (anySorted) {
            if (isEditingCell) pendingRerender = true;
            else renderSchedule();
          }
        } catch (e) {
          console.error(e);
        }
      }
    }

    function _formatAgo(ms) {
      if (ms == null) return '未更新';
      const diff = Date.now() - ms;
      if (diff < 0) return 'たった今';
      const s = Math.floor(diff / 1000);
      if (s < 10) return 'たった今';
      if (s < 60) return `${s}秒前`;
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}分前`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}時間前`;
      const d = Math.floor(h / 24);
      return `${d}日前`;
    }

    function _formatDateTimeShort(ms) {
      if (ms == null) return '';
      const d = new Date(ms);
      const MM = String(d.getMonth() + 1).padStart(2, '0');
      const DD = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${MM}/${DD}\u00A0${hh}:${mm}`;
    }

    function generateYearlyCalendar() {
      const startYear = parseInt(document.getElementById('yearInput').value, 10);
      const newScheduleData = [];
      const dows = ['日', '月', '火', '水', '木', '金', '土'];

      for (let i = 0; i < 12; i++) {
        const month = (i + 3) % 12 + 1;
        const year = month >= 4 ? startYear : startYear + 1;
        const daysInMonth = new Date(year, month, 0).getDate();

        for (let day = 1; day <= daysInMonth; day++) {
          const date = new Date(year, month - 1, day);
          const dow = dows[date.getDay()];

          newScheduleData.push({
            id: `${year}-${month}-${day}`,
            year, month, day, dow,
            notice: '',
            duty: '',
            events: '',
            business: '',
            submission: '',
            vacation: '',
            holiday: null,     // ★追加：手入力上書き（null=自動）
            _autoHoliday: ''   // ★追加：自動祝日（表示用）
          });
        }
      }

      scheduleData = newScheduleData;

      let cacheLoaded = false;
      if (authUser) cacheLoaded = loadScheduleCache(startYear);

      scheduleData.forEach(it => { if (typeof it.notice !== 'string') it.notice = ''; });

      // ★追加：自動祝日を毎回付与（年度を変えたら自動で入る）
      applyAutoHolidaysToSchedule();

      renderSchedule();
      applyEditLockToDOM();
      updatePrintTitle();

      return cacheLoaded;
    }

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function escapeRegExp(s) { return String(s ?? '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    function nl2br(s) { return String(s ?? '').replace(/\n/g, '<br>'); }
    function highlightHtml(text, query) {
      const t = String(text ?? '');
      const q = String(query ?? '').trim();
      if (!q) return nl2br(escapeHtml(t));
      const safeText = escapeHtml(t);
      const safeQuery = escapeHtml(q);
      const re = new RegExp(escapeRegExp(safeQuery), 'gi');
      return nl2br(safeText.replace(re, (m) => `<mark class="bg-yellow-200 rounded px-0.5">${m}</mark>`));
    }

    // ★追加：チェック済みでも「検索ハイライト(mark)は薄くしない」
    //  - 薄くするのはマッチしていない文字だけ（span.cl-dim）
    function highlightChecklistText(text, query, checked) {
      const raw = String(text ?? '');
      const q = String(query ?? '').trim();
      if (!q) {
        const esc = escapeHtml(raw);
        return checked ? `<span class="cl-dim">${esc}</span>` : esc;
      }

      const re = new RegExp(escapeRegExp(q), 'gi');
      let out = '';
      let last = 0;
      let m;

      while ((m = re.exec(raw)) !== null) {
        const before = raw.slice(last, m.index);
        if (before) {
          const b = escapeHtml(before);
          out += checked ? `<span class="cl-dim">${b}</span>` : b;
        }

        // ★ハイライト部分は薄くしない
        out += `<mark class="bg-yellow-200 rounded px-0.5">${escapeHtml(m[0])}</mark>`;

        last = m.index + m[0].length;
      }

      const after = raw.slice(last);
      if (after) {
        const a = escapeHtml(after);
        out += checked ? `<span class="cl-dim">${a}</span>` : a;
      }

      if (!out) {
        const esc = escapeHtml(raw);
        out = checked ? `<span class="cl-dim">${esc}</span>` : esc;
      }

      return out;
    }

    // =========================================================
    // ★提出物（submission）チェックボックスUI
    // =========================================================
    function parseChecklist(text) {
      const lines = String(text ?? '').replace(/\r\n/g, '\n').split('\n');
      const items = [];
      let idx = 0;

      for (const raw of lines) {
        const line = String(raw ?? '').trim();
        if (!line) continue;

        let m;

        if ((m = line.match(/^\s*(?:-?\s*)?\[(x|X)\]\s*(.*)$/))) {
          items.push({ checked: true, text: (m[2] ?? '').trim(), idx: idx++ });
          continue;
        }
        if ((m = line.match(/^\s*(?:-?\s*)?\[\s*\]\s*(.*)$/))) {
          items.push({ checked: false, text: (m[1] ?? '').trim(), idx: idx++ });
          continue;
        }
        if ((m = line.match(/^\s*[☑✅✔︎✔️☒■🗹🔳]\s*(.*)$/))) {
          items.push({ checked: true, text: (m[1] ?? '').trim(), idx: idx++ });
          continue;
        }
        if ((m = line.match(/^\s*[□☐⬜◻︎◻▫️🔲]\s*(.*)$/))) {
          items.push({ checked: false, text: (m[1] ?? '').trim(), idx: idx++ });
          continue;
        }

        items.push({ checked: false, text: line, idx: idx++ });
      }
      return items;
    }

    function serializeChecklist(items) {
      return (items || [])
        .map(it => `${it.checked ? '[x]' : '[ ]'} ${String(it.text ?? '').replace(/\r?\n/g, ' ').trim()}`.trimEnd())
        .join('\n');
    }

    function renderChecklistField(host, itemId, field, editable, queryRaw) {
      const item = scheduleData.find(d => d.id === itemId);
      if (!item) return;

      // まずパース
      let parsed = parseChecklist(item[field] || '');

      // ★閲覧時：空ラベル行は「存在しない扱い」
      if (!editable) parsed = parsed.filter(x => String(x.text || '').trim() !== '');

      // ★提出物がない行はチェックボックス表示なし（閲覧は完全に空）
      if (!editable && parsed.length === 0) {
        host.innerHTML = '';
        return;
      }

      host.innerHTML = '';

      const allowToggle = !!authUser;           // 閲覧でもチェックはできる（ログイン時）
      const allowAdd = !!(authUser && canEdit); // 追加は編集モードのみ
      const allowTextEdit = !!(authUser && canEdit);

      // 追加ボタン（編集時のみ）
      if (allowAdd) {
        const top = document.createElement('div');
        top.className = 'flex items-center justify-end mb-1';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'text-xs px-2 py-1 rounded-md border border-slate-200 bg-white hover:bg-slate-50 active:scale-95';
        btn.textContent = '＋追加';
        btn.onclick = () => {
          const cur = parseChecklist(item[field] || '');
          const newIdx = cur.length ? Math.max(...cur.map(x => x.idx ?? 0)) + 1 : 0;
          cur.push({ checked: false, text: '', idx: newIdx });

          const nextText = serializeChecklist(cur);
          queueSave(itemId, field, nextText, { allowViewChecklist: false });

          renderChecklistField(host, itemId, field, true, queryRaw);

          setTimeout(() => {
            const inputs = host.querySelectorAll('[data-cl-text="1"]');
            if (inputs && inputs.length) inputs[inputs.length - 1].focus();
          }, 0);
        };
        top.appendChild(btn);
        host.appendChild(top);
      }

      // 編集時でも「何も無い」なら、ボタンだけで終わり（チェック行のプレースホルダは出さない）
      if (parsed.length === 0 && allowAdd) return;

      // 表示順：未完了→完了（安定）
      const sorted = parsed.slice().sort((a, b) => {
        if (a.checked !== b.checked) return a.checked ? 1 : -1;
        return (a.idx ?? 0) - (b.idx ?? 0);
      });

      const list = document.createElement('div');
      list.className = 'space-y-1';
      host.appendChild(list);

      const commit = (rerender) => {
        const nextText = serializeChecklist(sorted);
        // ★チェック操作は閲覧でも保存：submissionのみ許可
        queueSave(itemId, field, nextText, { allowViewChecklist: true });
        if (rerender) renderChecklistField(host, itemId, field, editable, queryRaw);
      };

      sorted.forEach((it, i) => {
        const row = document.createElement('div');
        row.className = 'flex items-start gap-2';
        list.appendChild(row);

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!it.checked;
        cb.disabled = !allowToggle;
        cb.className = 'mt-1 h-4 w-4 accent-indigo-600';
        cb.onchange = () => {
          it.checked = cb.checked;
          commit(true);
        };
        row.appendChild(cb);

        const text = document.createElement('div');
        text.className = 'flex-1 text-sm text-amber-700 font-medium whitespace-pre-wrap leading-relaxed';

        if (it.checked) text.classList.add('line-through');

        if (allowTextEdit) {
          if (it.checked) text.classList.add('cl-dim');

          text.classList.add('editable');
          text.contentEditable = 'true';
          text.setAttribute('data-cl-text', '1');
          text.innerText = it.text || '';

          text.addEventListener('focus', () => onChecklistFocus(itemId, field));

          text.addEventListener('input', () => {
            it.text = String(text.innerText ?? '').replace(/\r?\n/g, ' ').trimEnd();
            commit(false);
          });

          text.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              const cur = parseChecklist(item[field] || '');
              const newIdx = cur.length ? Math.max(...cur.map(x => x.idx ?? 0)) + 1 : 0;
              cur.push({ checked: false, text: '', idx: newIdx });

              queueSave(itemId, field, serializeChecklist(cur), { allowViewChecklist: false });
              renderChecklistField(host, itemId, field, true, queryRaw);

              setTimeout(() => {
                const inputs = host.querySelectorAll('[data-cl-text="1"]');
                if (inputs && inputs.length) inputs[inputs.length - 1].focus();
              }, 0);
            }
          });
        } else {
          text.innerHTML = highlightChecklistText(it.text || '', queryRaw, !!it.checked);
        }

        row.appendChild(text);
      });
    }

    // ========= CSV =========
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (char === '"') {
          if (inQuotes && text[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (char === ',' && !inQuotes) {
          row.push(field);
          field = '';
          continue;
        }

        if (!inQuotes && (char === '\n' || char === '\r')) {
          if (char === '\r' && text[i + 1] === '\n') i++;
          row.push(field);
          rows.push(row);
          row = [];
          field = '';
          continue;
        }

        field += char;
      }

      row.push(field);
      rows.push(row);

      const cleaned = rows
        .map(r => r.map(c => String(c ?? '')))
        .filter(r => r.some(c => String(c).trim() !== ''));

      if (cleaned.length > 0 && cleaned[0].length > 0) {
        cleaned[0][0] = cleaned[0][0].replace(/^\uFEFF/, '');
      }

      return cleaned;
    }

    function pick(before, candidateRaw) {
      const c = norm(candidateRaw);
      return c ? c : before;
    }

    function readFileAsText(file, encoding) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result || ''));
        r.onerror = () => reject(r.error || new Error('FileReader error'));
        r.readAsText(file, encoding);
      });
    }

    async function importCSV(input) {
      if (!(authUser && canEdit)) {
        alert('CSVインポートは「ログイン＋編集モード」の時だけできます。');
        input.value = '';
        return;
      }

      const file = input.files[0];
      if (!file) return;

      try {
        let text = await readFileAsText(file, 'UTF-8');
        let table = parseCSV(String(text || ''));

        if (table.length < 2) { alert('CSVにデータ行がありません。'); return; }

        let headerLine = table[0].map(v => String(v ?? '').trim());

        const mapping = {
          '月': -1,
          '日': -1,
          '曜日': -1,
          '祝日': -1,   // ★追加
          '日直': -1,
          '予定': -1,
          '出張': -1,
          '提出物': -1,
          'お知らせ': -1,
          '休暇': -1
        };

        headerLine.forEach((h, i) => {
          const cleanH = String(h ?? '').trim();
          if (Object.prototype.hasOwnProperty.call(mapping, cleanH)) mapping[cleanH] = i;
        });

        if (mapping['月'] === -1 || mapping['日'] === -1) {
          text = await readFileAsText(file, 'Shift-JIS');
          table = parseCSV(String(text || ''));

          if (table.length < 2) { alert('CSVにデータ行がありません。'); return; }

          headerLine = table[0].map(v => String(v ?? '').trim());

          mapping['月'] = mapping['日'] = mapping['曜日'] = mapping['祝日'] =
          mapping['日直'] = mapping['予定'] = mapping['出張'] = mapping['提出物'] = mapping['お知らせ'] = mapping['休暇'] = -1;

          headerLine.forEach((h, i) => {
            const cleanH = String(h ?? '').trim();
            if (Object.prototype.hasOwnProperty.call(mapping, cleanH)) mapping[cleanH] = i;
          });
        }

        if (mapping['月'] === -1 || mapping['日'] === -1) {
          alert('CSVのヘッダーに「月」「日」が見つかりませんでした。');
          return;
        }

        const dataRows = table.slice(1);
        let count = 0, skipped = 0;
        const startYear = getStartYear();
        const touched = [];

        dataRows.forEach(colsRaw => {
          const cols = colsRaw.map(v => String(v ?? ''));
          const m = parseInt(String(cols[mapping['月']] ?? '').trim(), 10);
          const d = parseInt(String(cols[mapping['日']] ?? '').trim(), 10);
          if (!Number.isFinite(m) || !Number.isFinite(d)) { skipped++; return; }

          const y = (m >= 4) ? startYear : startYear + 1;
          const target = scheduleData.find(item => item.year === y && item.month === m && item.day === d);
          if (!target) { skipped++; return; }

          const before = {
            notice: norm(target.notice),
            duty: norm(target.duty),
            events: norm(target.events),
            business: norm(target.business),
            submission: norm(target.submission),
            vacation: norm(target.vacation),
            holiday: (typeof target.holiday === 'string') ? norm(target.holiday) : null
          };

          const next = { ...before };

          if (mapping['日直'] !== -1) next.duty = pick(before.duty, cols[mapping['日直']]);
          if (mapping['予定'] !== -1) next.events = pick(before.events, cols[mapping['予定']]);
          if (mapping['出張'] !== -1) next.business = pick(before.business, cols[mapping['出張']]);
          if (mapping['提出物'] !== -1) next.submission = pick(before.submission, cols[mapping['提出物']]);
          if (mapping['お知らせ'] !== -1) next.notice = pick(before.notice, cols[mapping['お知らせ']]);
          if (mapping['休暇'] !== -1) next.vacation = pick(before.vacation, cols[mapping['休暇']]);

          // ★祝日（空欄＝「その日が自動祝日なら抑制」、非祝日なら上書き無し）
          if (mapping['祝日'] !== -1) {
            const cell = norm(cols[mapping['祝日']]);
            const auto = String(target._autoHoliday || '').trim();
            if (cell) next.holiday = cell;                 // 上書き
            else next.holiday = auto ? '' : null;          // autoがある日は抑制、無い日は上書き無し
          }

          const changed =
            next.notice !== before.notice ||
            next.duty !== before.duty ||
            next.events !== before.events ||
            next.business !== before.business ||
            next.submission !== before.submission ||
            next.vacation !== before.vacation ||
            next.holiday !== before.holiday;

          if (!changed) return;

          target.notice = next.notice;
          target.duty = next.duty;
          target.events = next.events;
          target.business = next.business;
          target.submission = next.submission;
          target.vacation = next.vacation;
          target.holiday = next.holiday;

          sortChecklistInItem(target);

          touched.push(target);
          count++;
        });

        if (count > 0) {
          renderSchedule();
          try { await batchSaveToCloud(touched); } catch (err) { console.error(err); }

          touched.forEach(it => {
            _fields().forEach(f => {
              _baseValue.set(_k(it.id, f), norm(it[f] || ''));
              clearDirty(it.id, f);
            });
            _pendingItemIds.delete(it.id);
            if (_saveTimers.has(it.id)) {
              clearTimeout(_saveTimers.get(it.id));
              _saveTimers.delete(it.id);
            }
          });

          queueScheduleCacheSave();

          alert(`${count}件の予定を更新しました。${skipped ? `（スキップ ${skipped}行）` : ''}`);
        } else {
          alert('有効なデータが見つかりませんでした。');
        }
      } catch (e) {
        console.error(e);
        alert('CSVの読み込みに失敗しました。別の形式（UTF-8/Shift-JIS）で保存し直してお試しください。');
      } finally {
        input.value = '';
      }
    }

    function csvEscape(v) {
      const s = String(v ?? '');
      if (/[",\r\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
      return s;
    }

    function exportCSV() {
      if (!authUser) { alert('CSVエクスポートはログイン後にできます。'); return; }

      const startYear = getStartYear();

      const rows = [...scheduleData].sort((a, b) => {
        if (a.year !== b.year) return a.year - b.year;
        if (a.month !== b.month) return a.month - b.month;
        return a.day - b.day;
      });

      // ★祝日列を追加
      const header = ['月','日','曜日','祝日','日直','予定','出張','提出物','お知らせ','休暇'];
      const lines = [header.map(csvEscape).join(',')];

      rows.forEach(it => {
        const hol = getHolidayEffective(it);
        const line = [
          it.month,
          it.day,
          it.dow || '',
          hol || '',
          it.duty || '',
          it.events || '',
          it.business || '',
          it.submission || '',
          it.notice || '',
          it.vacation || ''
        ].map(csvEscape).join(',');
        lines.push(line);
      });

      const csvText = '\uFEFF' + lines.join('\r\n');
      const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `schedule_${startYear}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function loginWithIdPass() {
      const id = document.getElementById('idInput').value.trim();
      const pass = document.getElementById('passInput').value;

      const email = toEmailFromId(id);
      if (!email) { alert('IDは英数・記号 . _ - のみで入力してください。'); return; }
      if (!pass || pass.length < 6) { alert('Passwordは6文字以上で入力してください。'); return; }

      try {
        setSyncBadge('接続中', 'wait');
        await firebase.auth().signInWithEmailAndPassword(email, pass);
        localStorage.setItem(LAST_ID_KEY, id);
        closeLoginModal();
      } catch (e) {
        console.error(e);
        setSyncBadge('未接続', 'idle');
        alert(friendlyAuthError(e, 'ログイン'));
      }
    }

    async function logout() {
      try {
        await flushAllPendingSaves();
        await firebase.auth().signOut();
        closeLoginModal();
      } catch (e) { console.error(e); }
    }

    function toggleMode() {
      if (!authUser) {
        canEdit = false;
        setModeBadge();
        applyEditLockToDOM();
        alert('モード切替はログイン後にできます。');
        return;
      }
      canEdit = !canEdit;
      setModeBadge();
      renderSchedule();
      applyEditLockToDOM();
    }

    window.onload = init;
  </script>
</body>
</html>
