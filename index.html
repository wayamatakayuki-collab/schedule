<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0" />
  <title>School Cal</title>

  <!-- favicon（PC/タブ用） -->
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

  <!-- iOS ホーム画面アイコン（最重要） -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">

  <!-- iOSでアプリっぽく -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- ★Firebase（Compat） -->
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }
/* ★追加：iOS Safari等の自動文字拡大を無効化（端末差対策） */
html { -webkit-text-size-adjust: 100%; }

/* ★追加：スマホ横向き時は「学校名」を「年度」と同じサイズに */
@media (orientation: landscape) and (max-width: 767px) {
  #schoolName{
    font-size: 1rem;      /* ← text-base（年度と同等） */
    line-height: 1.25rem;
  }
}
    /* 画面では隠す（印刷でだけ出す） */
    .print-only { display: none; }
    .print-title { font-weight: 700; font-size: 14px; color: #0f172a; }

    @media print {
      /* ★A4縦＋見出し用 */
      @page { size: A4 portrait; margin: 8mm; }

      .no-print { display: none !important; }
      body { background-color: white !important; padding: 0 !important; }
      main { margin-top: 0 !important; }

      /* ★印刷ヘッダー（見出し） */
      .print-only {
        display: block !important;
        margin: 0 0 6mm 0;
      }
      .print-title {
        border-bottom: 1px solid #cbd5e1;
        padding-bottom: 3mm;
      }

      .card {
        border: 1px solid #cbd5e1 !important;
        break-inside: avoid;
        margin-bottom: 2px !important;
        box-shadow: none !important;
      }
    }

    .scrollbar-hide::-webkit-scrollbar { display: none; }

    .editable {
      min-height: 1.5em;
      width: 100%;
      transition: all 0.2s;
    }
    .editable:hover { background-color: #f8fafc; outline: 1px dashed #cbd5e1; }
    .editable:focus { background-color: white; outline: 2px solid #3b82f6; }

    /* ★閲覧モードの見た目 */
    .readonly {
      pointer-events: none !important;
      user-select: text;
      background-color: transparent !important;
      outline: none !important;
    }
    .readonly:hover { outline: none !important; background-color: transparent !important; }

    /* ====== ★ツール折りたたみ（スマホ中心） ====== */
    .tools-wrap{
      overflow: hidden;
      transition: max-height .25s ease, opacity .2s ease;
      max-height: 1200px; /* 展開時の最大高さ（十分大きく） */
      opacity: 1;
    }
    body.tools-collapsed .tools-wrap{
      max-height: 0;
      opacity: 0;
    }

    /* =========================
       ② CSS（<style> 内に追記）
       ★スマホ横(landscape)だけ：PCと同じ“横並び”にする（PCは影響なし）
       ========================= */
    @media (max-width: 767px) and (orientation: landscape) {
      .mobile-landscape-row {
        flex-direction: row !important;
        align-items: center !important;
        gap: 0.5rem !important;
      }
      .mobile-landscape-mt0 {
        margin-top: 0 !important;
      }
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen pb-10">

  <header class="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm no-print">

    <!-- ★ツール群：折りたたみ対象（タイトル＋ログイン＋最終更新＋更新＋CSV） -->
    <div id="toolsWrap" class="tools-wrap">
      <!-- ★ここを「2段構成」に変更（1段目：左 / 2段目：右） -->
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col gap-3">

        <!-- 1段目：左（ロゴ＋年度＋学校名） -->
        <div class="flex items-start">
          <!-- 左：ロゴ＋タイトル（★スマホだけ：タイトルと学校名をロゴの下へ） -->
          <div class="flex flex-row items-end gap-3 md:gap-3">
            <!-- ロゴ -->
            <div class="h-10 shrink-0">
              <img src="./logo.png" alt="School Cal SHARE" class="h-full w-auto object-contain">
            </div>

            <!-- 年度（ロゴ右：スマホでも横並びで1行固定）＋学校名 -->
            <div class="min-w-0 w-full">
              <!-- ★スマホ：縦（年度→学校名） / PC：横（年度の右に学校名） -->
              <!-- ① HTML（クラスを2つ足すだけ）: mobile-landscape-row を追加 -->
              <div class="flex flex-col md:flex-row md:items-center md:gap-2 min-w-0 mobile-landscape-row">
                <!-- 年度行（1行固定） -->
                <div class="flex items-center gap-2 whitespace-nowrap">
                  <input type="number" id="yearInput" value="2025"
                    class="w-16 md:w-20 font-bold text-base md:text-lg text-center border-b-2 border-indigo-600 focus:outline-none"
                    onchange="generateYearlyCalendar(); updatePrintTitle();" />
                  <span class="font-bold text-base md:text-xl">年度</span>
                </div>

                <!-- 学校名：スマホは下 / PCは年度の右（年度と同じサイズ） -->
                <!-- ① HTML（クラスを2つ足すだけ）: mobile-landscape-mt0 を追加 -->
             <div id="schoolName"
  class="mt-1 md:mt-0 min-w-0 truncate leading-tight md:leading-normal
         text-[11px] text-slate-800 font-bold md:text-xl
         editable"
  contenteditable="true"
  onblur="saveSchoolName()">
  （学校名）
</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 2段目：左寄せ（ログイン/最終更新/更新/CSV） -->
        <div class="flex w-full justify-end md:justify-start">
          <!-- 右：操作群（検索はここに置かない：常時表示エリアへ移動） -->
          <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2 md:gap-3 w-full md:w-auto">
            <!-- ログイン -->
            <button id="loginBtn" onclick="openLoginModal()"
              class="px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm hover:bg-slate-50 flex items-center gap-2 w-full md:w-auto justify-between md:justify-start">
              <span class="text-slate-500">ログイン</span>
              <span id="loginBadge" class="px-2 py-0.5 rounded-full bg-slate-50 text-slate-500 text-xs">未ログイン</span>
              <span id="syncBadge" class="px-2 py-0.5 rounded-full bg-slate-50 text-slate-500 text-xs">未接続</span>
              <span class="text-slate-400">モード</span>
              <span id="modeBadge" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 text-xs select-none">閲覧</span>
            </button>

            <!-- ★ヘッダー右：最終更新 + 更新ボタン（スピナー/二重押し防止） -->
            <div class="flex items-center gap-2 w-full md:w-auto">
              <div id="lastUpdateLabel"
                class="flex-1 min-w-0 px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-sm text-slate-500 truncate">
                最終更新：未更新
              </div>

              <button id="refreshBtn" type="button" onclick="manualRefresh()"
                class="shrink-0 px-6 md:px-10 md:min-w-[140px] py-2 rounded-lg border border-slate-200 bg-white text-sm hover:bg-slate-50 active:scale-95 inline-flex items-center gap-2 justify-center">
                <svg id="refreshSpinner" class="hidden h-4 w-4 animate-spin text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 00-4 4H4z"></path>
                </svg>
                <!-- ★「更新」を太字に -->
                <span id="refreshBtnText" class="whitespace-nowrap font-bold">更新</span>
              </button>
            </div>

            <!-- ★ヘッダー：CSV（インポート/エクスポート） -->
            <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2 w-full md:w-auto">
              <div class="flex items-center gap-2 w-full md:w-auto">
                <div class="flex-1 md:flex-none flex items-center space-x-2 bg-slate-50 border border-slate-200 p-1.5 rounded-xl">
                  <label id="csvLabel"
                    class="w-full md:w-auto cursor-pointer bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center justify-center shadow-sm active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24"
                      stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    CSVインポート
                    <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="importCSV(this)">
                  </label>

                  <button id="csvExportBtn" onclick="exportCSV()"
                    class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center justify-center shadow-sm active:scale-95">
                   <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" />
</svg>
                    CSVエクスポート
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div><!-- /tools-wrap -->

    <!-- ★常時表示：検索 + 「ツールを隠す／表示」 -->
    <div class="max-w-7xl mx-auto px-4 py-2 border-t border-slate-100">
      <div class="flex items-center gap-2">
        <!-- 検索（常時表示） -->
        <div class="relative flex-1">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </span>

          <!-- ★①：text-sm → text-base（iOSの自動ズーム防止） -->
          <input type="text" id="searchInput" placeholder="検索"
            class="block w-full pl-10 pr-10 py-2 border border-slate-200 rounded-lg bg-slate-50 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">

          <button id="clearSearchBtn" type="button" aria-label="検索をクリア"
            class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
            onclick="clearSearch()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <!-- ツール表示切替 -->
        <button id="toggleToolsBtn" type="button" onclick="toggleTools()"
          class="shrink-0 px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm hover:bg-slate-50 active:scale-95">
          <span id="toggleToolsText">ツールを隠す</span>
        </button>
      </div>
    </div>

    <!-- 月：PCはボタン／スマホはドロップダウン -->
    <div class="max-w-7xl mx-auto px-4 border-t border-slate-100">
      <div class="hidden md:flex space-x-1 py-2 overflow-x-auto scrollbar-hide" id="monthNav"></div>

      <div class="md:hidden py-2">
        <select id="monthSelect"
          class="w-full px-3 py-3 rounded-xl border border-slate-200 bg-slate-50 text-base font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
          onchange="onMonthSelectChange(this.value)">
        </select>
      </div>
    </div>

    <!-- タブ -->
    <div class="max-w-7xl mx-auto px-4 overflow-x-auto scrollbar-hide">
      <div class="flex space-x-6 text-sm font-medium" id="tabsztabs">
        <button onclick="switchTab('all')" data-tab="all"
          class="tab-btn py-3 border-b-2 border-indigo-600 text-indigo-600">全体</button>

        <!-- ★順番修正：提出物 と 休暇 の間に お知らせ -->
        <button onclick="switchTab('school')" data-tab="school"
          class="tab-btn py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-700">予定</button>
        <button onclick="switchTab('business')" data-tab="business"
          class="tab-btn py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-700">出張</button>
        <button onclick="switchTab('submission')" data-tab="submission"
          class="tab-btn py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-700">報告・提出</button>

        <button onclick="switchTab('notice')" data-tab="notice"
          class="tab-btn py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-700">お知らせ</button>

        <button onclick="switchTab('vacation')" data-tab="vacation"
          class="tab-btn py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-700">休暇</button>
      </div>
    </div>
  </header>

  <!-- ★印刷用ヘッダー（画面では非表示、印刷時のみ表示） -->
  <div id="printHeader" class="print-only max-w-7xl mx-auto px-4">
    <div id="printTitle" class="print-title"></div>
  </div>

  <main class="max-w-7xl mx-auto px-4 mt-6">
    <div id="lockedState"
      class="hidden py-16 text-center bg-white rounded-xl border border-dashed border-slate-300">
      <div class="text-slate-700 font-bold">ログインしてください</div>
      <div class="text-slate-500 text-sm mt-2">ログイン後、クラウドの予定が表示・同期されます。</div>
      <button onclick="openLoginModal()"
        class="mt-5 px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
        ログインへ
      </button>
    </div>

    <div id="scheduleContainer" class="space-y-2"></div>

    <div id="emptyState"
      class="hidden py-20 text-center text-slate-400 bg-white rounded-xl border border-dashed border-slate-300">
      表示できる予定がありません。
    </div>
  </main>

  <div class="no-print fixed bottom-2 left-0 right-0 text-center text-[11px] text-slate-400 select-none">
    @School Cal  Takayuki WAYAMA
  </div>

  <!-- ★トースト（右下） -->
  <div id="toast" class="pointer-events-none hidden fixed bottom-4 right-4 z-50">
    <div id="toastInner"
      class="pointer-events-auto max-w-sm rounded-xl border border-slate-200 bg-white shadow-lg px-4 py-3 text-sm text-slate-700 flex items-start gap-3">
      <div class="mt-0.5">
        <div id="toastIcon"
          class="h-7 w-7 rounded-full bg-emerald-50 text-emerald-700 flex items-center justify-center">✓</div>
      </div>
      <div class="flex-1">
        <div id="toastTitle" class="font-bold">更新しました</div>
        <div id="toastMsg1" class="text-slate-500 mt-0.5">最新の予定を読み込みました。</div>
        <div id="toastMsg2" class="text-slate-500 mt-0.5"></div>
      </div>
    </div>
  </div>

  <!-- ★ログイン モーダル -->
  <div id="loginModal" class="hidden fixed inset-0 z-50">
    <div class="absolute inset-0 bg-black/40" onclick="closeLoginModal()"></div>

    <div class="absolute inset-0 overflow-y-auto p-4 flex items-start justify-center"
         style="-webkit-overflow-scrolling: touch; overscroll-behavior: contain;">
      <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden"
           style="max-height: calc(100vh - 2rem); overflow-y: auto; -webkit-overflow-scrolling: touch;">
        <div class="p-4 border-b border-slate-100">
  <!-- ★ログイン画面にもロゴ -->
  <img src="./logo.png" alt="School Cal Share"
    class="h-10 w-auto mx-auto select-none"
    style="display:block;" />
</div>

        <div class="p-4 space-y-4">
          <!-- 1) ID -->
          <div>
            <label class="text-sm font-medium text-slate-700">ID</label>
            <input id="idInput" type="text" placeholder=""
              class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>

          <!-- 2) Password -->
          <div>
            <label class="text-sm font-medium text-slate-700">Password（6文字以上）</label>
            <input id="passInput" type="password" placeholder=""
              class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <div class="text-xs text-slate-500 mt-1">
            </div>
          </div>

          <!-- 3) モード切り替え -->
          <div class="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl p-3">
            <div>
              <div class="text-sm font-medium text-slate-700">モード</div>
              <div class="text-xs text-slate-500">ログイン後に切り替えできます</div>
            </div>
            <button onclick="toggleMode()"
              class="px-3 py-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-sm">
              <span id="modeBtnText">閲覧 ⇄ 編集</span>
            </button>
          </div>

          <!-- 4) ログインボタン・ログアウトボタン -->
          <div class="grid grid-cols-2 gap-2">
            <button onclick="loginWithIdPass()"
              class="w-full px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
              ログイン
            </button>

            <button onclick="logout()"
              class="w-full px-4 py-2 rounded-lg border border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100">
              ログアウト
            </button>
          </div>

          <!-- 5) 区切り線 -->
          <hr class="border-slate-200" />

          <!-- 6) ID新規作成コード -->
          <div>
            <label class="text-sm font-medium text-slate-700">ID新規作成コード</label>
            <input id="createCodeInput" type="password" inputmode="numeric" placeholder=""
              class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <div class="text-xs text-slate-500 mt-1">
              ※通常のログインには不要です。<br>
              ※不正利用防止のため、IDの新規作成は管理者（WAYAMA）が行い、許可なく作成されたアカウントは削除いたします。
            </div>
          </div>

          <!-- 7) ID新規作成ボタン・キャンセルボタン -->
          <div class="grid grid-cols-2 gap-2">
            <button onclick="createNewAccount()"
              class="w-full px-4 py-2 rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100">
              ID新規作成
            </button>

            <button onclick="closeLoginModal()"
              class="w-full px-4 py-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50">
              キャンセル
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // 方針（完璧版）は崩さない：
    //  - 更新ボタン文化（差分同期 lastSeen）そのまま
    //  - write は変更があった日だけ
    // 追加（軽い調整）：
    //  - 予定データ本体（scheduleData）を端末にキャッシュして、
    //    ログアウト→ログインでも「初回だけフルread」、以降は差分readにする
    // =========================================================

    // ========= 状態 =========
    let scheduleData = [];
    let currentMonth = 4;
    let currentTab = 'all';

    // ★検索語は「共通で1つ」：タブ/月を切り替えても消さない
    let globalSearchQuery = '';

    // ========= Firebase =========
    let firebaseReady = false;
    let db = null;
    let authUser = null;

    // ログインID表示用（IDだけ保存。Passwordは保存しない）
    const LAST_ID_KEY = 'schedule_last_id_v1';

    // ★ツール折りたたみ状態（端末に保存）
    const TOOLS_COLLAPSED_KEY = 'schedule_tools_collapsed_v1';

    // ★最後に見ていた月（端末に保存） ※リロードで4月に戻らない対策
    const LAST_MONTH_KEY = 'schedule_last_month_v1';

    // ★差分同期カーソル（前回更新時点まで読み込んだupdatedAt）
    // ・更新ボタンでは「updatedAt > lastSeen」を読む
    // ・0件なら lead(read) は 0ドキュメント相当
    const LAST_SEEN_KEY_PREFIX = 'schedule_last_seen_millis_v1__';

    // ★予定データ本体キャッシュ（uid + 年度で分離）
    const LOCAL_CACHE_PREFIX = 'schedule_cache_v1__';

    // ★ID新規作成コード（固定）
    const FIXED_CREATE_CODE = '20136684';

    // モード：閲覧/編集（ログイン後に誰でも切替）
    let canEdit = false;

    // =========================================================
    // ★保存ロジック（ここが今回の差し替えポイント）
    // 1) フィールド単位→「日（カード）単位」でまとめて1回だけ保存（timerキーは itemId ）
    // 2) blur保存→「カードから完全に離れたら」だけ即保存（カードfocusoutでflush）
    // =========================================================

    // ★保存デバウンス（dirty管理 / カード単位 / 二重write抑制）
    const _saveTimers = new Map();       // itemId => timer
    const _pendingItemIds = new Set();   // item.id（未保存変更がある日）
    const _baseValue = new Map();        // key(id__field) => baseline (normalized)
    const _dirtyKeys = new Set();        // key(id__field)
    const _itemDirtyCount = new Map();   // itemId => dirty field count
    const _savingItems = new Set();      // itemId in-flight
    const _needsResaveItems = new Set(); // itemId: save中にさらに変更が入った

    function _k(id, field) { return `${id}__${field}`; }

    // 値の正規化（※現行のtrim運用に合わせる）
    function norm(v) {
      return String(v ?? '').replace(/\r\n/g, '\n').trim();
    }

    function markDirty(id, field) {
      const key = _k(id, field);
      if (_dirtyKeys.has(key)) return;
      _dirtyKeys.add(key);
      _itemDirtyCount.set(id, (_itemDirtyCount.get(id) || 0) + 1);
      _pendingItemIds.add(id);
    }

    function clearDirty(id, field) {
      const key = _k(id, field);
      if (!_dirtyKeys.has(key)) return;
      _dirtyKeys.delete(key);
      const n = (_itemDirtyCount.get(id) || 0) - 1;
      if (n <= 0) _itemDirtyCount.delete(id);
      else _itemDirtyCount.set(id, n);

      // その日が完全にdirtyじゃなく、debounceも無いならpending解除
      if (!hasDirtyForItem(id) && !_saveTimers.has(id)) {
        _pendingItemIds.delete(id);
      }
    }

    function hasDirtyForItem(id) {
      return (_itemDirtyCount.get(id) || 0) > 0;
    }

    function setBaselineFromCurrent(id, field, value) {
      const key = _k(id, field);
      _baseValue.set(key, norm(value));
    }

    function _fields() {
      // ★追加：notice
      return ['notice', 'duty', 'events', 'business', 'submission', 'vacation'];
    }

    // ====== ★ローカルキャッシュ（予定データ本体） ======
    function _cacheKey(startYear) {
      if (!authUser) return null;
      return `${LOCAL_CACHE_PREFIX}${authUser.uid}__${startYear}`;
    }

    function loadScheduleCache(startYear) {
      try {
        const k = _cacheKey(startYear);
        if (!k) return false;
        const raw = localStorage.getItem(k);
        if (!raw) return false;

        const arr = JSON.parse(raw);
        // 1年分あるか軽くチェック（年度で約365）
        if (!Array.isArray(arr) || arr.length < 300) return false;

        scheduleData = arr;
        // 旧キャッシュ互換：notice が無い場合に備え、空で補完
        scheduleData.forEach(it => { if (typeof it.notice !== 'string') it.notice = ''; });
        return true;
      } catch (e) {
        console.error(e);
        return false;
      }
    }

    let _cacheSaveTimer = null;
    function queueScheduleCacheSave() {
      if (!authUser) return;
      const startYear = getStartYear();
      const k = _cacheKey(startYear);
      if (!k) return;

      // 保存連打しないように軽くデバウンス
      if (_cacheSaveTimer) clearTimeout(_cacheSaveTimer);
      _cacheSaveTimer = setTimeout(() => {
        try {
          localStorage.setItem(k, JSON.stringify(scheduleData));
        } catch (e) {
          console.error(e);
        }
      }, 500);
    }

    async function commitSaveItem(itemId) {
      if (!(authUser && canEdit)) return;

      // dirtyが無いなら何もしない（write 0）
      if (!hasDirtyForItem(itemId)) {
        _pendingItemIds.delete(itemId);
        return;
      }

      // 同じ日に対して並行saveを避ける
      if (_savingItems.has(itemId)) {
        _needsResaveItems.add(itemId);
        return;
      }

      const item = scheduleData.find(d => d.id === itemId);
      if (!item) return;

      _savingItems.add(itemId);

      try {
        await saveDayToCloud(item);

        // ★保存成功：その時点の値を baseline にし、dirty/pending を外す
        _fields().forEach(f => {
          _baseValue.set(_k(itemId, f), norm(item[f] || ''));
          clearDirty(itemId, f);
        });

        _pendingItemIds.delete(itemId);

        // ★端末キャッシュも更新（ログインし直しでもフルread回避）
        queueScheduleCacheSave();
      } catch (e) {
        console.error(e);
      } finally {
        _savingItems.delete(itemId);

        // save中にさらに変更が入っていたら、もう一度だけ追いかけ保存
        if (_needsResaveItems.has(itemId)) {
          _needsResaveItems.delete(itemId);
          if (hasDirtyForItem(itemId)) {
            await commitSaveItem(itemId);
          }
        }
      }
    }

    // ====== ★追加：編集中のフォーカス落ち防止（見た目は変えない） ======
    let isEditingCell = false;

    // ====== ★iOS relatedTarget=null 対策のため「直前に触った要素」を追跡 ======
    let _lastPointerDownTarget = null;
    function _trackLastPointerTarget(e) { _lastPointerDownTarget = e.target; }
    document.addEventListener('pointerdown', _trackLastPointerTarget, true);
    document.addEventListener('mousedown', _trackLastPointerTarget, true);

    // ====== ★①：文字入力したら自動で元の画面サイズへ（iOS Safariの自動ズーム解除） ======
    const _viewportMetaEl = () => document.getElementById('viewportMeta') || document.querySelector('meta[name=viewport]');
    const _baseViewportContent = (() => {
      const m = _viewportMetaEl();
      return m ? (m.getAttribute('content') || 'width=device-width, initial-scale=1.0') : 'width=device-width, initial-scale=1.0';
    })();
    let _zoomResetDoneForThisFocus = false;

    function _isIOSSafari() {
      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isWebKit = /WebKit/.test(ua);
      const isNotOtheriOSBrowser = !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
      return isIOS && isWebKit && isNotOtheriOSBrowser;
    }

    function resetZoomIfNeeded() {
      if (_zoomResetDoneForThisFocus) return;
      if (!_isIOSSafari()) return;

      const vv = window.visualViewport;
      if (vv && typeof vv.scale === 'number' && vv.scale <= 1.01) {
        _zoomResetDoneForThisFocus = true;
        return;
      }

      const meta = _viewportMetaEl();
      if (!meta) {
        _zoomResetDoneForThisFocus = true;
        return;
      }

      const y = window.scrollY;
      meta.setAttribute('content', `${_baseViewportContent}, maximum-scale=1.0`);
      setTimeout(() => {
        meta.setAttribute('content', _baseViewportContent);
        window.scrollTo(0, y);
      }, 80);

      _zoomResetDoneForThisFocus = true;
    }

    // ★②：検索欄など blur 時に確実に元倍率へ戻す（iOS Safari対策）
    function forceResetZoom() {
      if (!_isIOSSafari()) return;

      const meta = _viewportMetaEl();
      if (!meta) return;

      const y = window.scrollY;
      meta.setAttribute('content', `${_baseViewportContent}, maximum-scale=1.0`);

      setTimeout(() => {
        meta.setAttribute('content', _baseViewportContent);
        window.scrollTo(0, y);
      }, 80);
    }

    function onCellFocus(id, field, value) {

    // ★カードから完全に離れたら保存（focusout）
    // ✅ iOS Safariで relatedTarget が null になっても誤判定しない版
    function attachCardSaveOnLeave(card, itemId) {
      const doCommit = async () => {
        // カード単位保存：debounceが残っていれば取消して即保存
        if (_saveTimers.has(itemId)) {
          clearTimeout(_saveTimers.get(itemId));
          _saveTimers.delete(itemId);
        }

        // 編集状態を外す（必要なら再描画を後回し）
        isEditingCell = false;
        activeEdit = null;
        _zoomResetDoneForThisFocus = false;

        await commitSaveItem(itemId);

        if (pendingRerender) {
          pendingRerender = false;
          renderSchedule();
        }
      };

      card.addEventListener('focusout', (e) => {
        if (!(authUser && canEdit)) return;

        const to = e.relatedTarget;

        if (to && card.contains(to)) return;

        if (!to) {
          setTimeout(() => {
            const ae = document.activeElement;

            if (ae && card.contains(ae)) return;
            if (_lastPointerDownTarget && card.contains(_lastPointerDownTarget)) return;

            doCommit();
          }, 0);
          return;
        }

        doCommit();
      });
    }

    // ========= ★差分同期カーソル（最終既読） =========
    function _seenKey(startYear) {
      if (!authUser) return null;
      return `${LAST_SEEN_KEY_PREFIX}${authUser.uid}__${startYear}`;
    }
    function getLastSeenTs(startYear) {
      const k = _seenKey(startYear);
      if (!k) return null;
      const ms = parseInt(localStorage.getItem(k) || '', 10);
      if (!Number.isFinite(ms) || ms <= 0) return null;
      return firebase.firestore.Timestamp.fromMillis(ms);
    }
    function setLastSeenTs(startYear, ts) {
      const k = _seenKey(startYear);
      if (!k) return;
      const ms = (ts && typeof ts.toMillis === 'function') ? ts.toMillis() : Date.now();
      localStorage.setItem(k, String(ms));
    }

    function findDayByYMD(y, m, d) {
      return scheduleData.find(it => it.year === y && it.month === m && it.day === d) || null;
    }

    function applyCloudDocToLocal(docData) {
      const data = docData || {};
      const y = data.year, m = data.month, d = data.day;
      if (!Number.isFinite(y) || !Number.isFinite(m) || !Number.isFinite(d)) return false;

      const target = findDayByYMD(y, m, d);
      if (!target) return false;

      const ae = activeEdit && activeEdit.id ? activeEdit : null;
      const sameItem = ae && (target.id === ae.id);

      // ★ソフト削除（isDeleted=true）は、ローカルを空にする
      if (data.isDeleted === true) {
        if (!(sameItem && ae.field === 'notice')) target.notice = '';
        if (!(sameItem && ae.field === 'duty')) target.duty = '';
        if (!(sameItem && ae.field === 'events')) target.events = '';
        if (!(sameItem && ae.field === 'business')) target.business = '';
        if (!(sameItem && ae.field === 'submission')) target.submission = '';
        if (!(sameItem && ae.field === 'vacation')) target.vacation = '';
        return true;
      }

      if (!(sameItem && ae.field === 'notice')) target.notice = data.notice || '';
      if (!(sameItem && ae.field === 'duty')) target.duty = data.duty || '';
      if (!(sameItem && ae.field === 'events')) target.events = data.events || '';
      if (!(sameItem && ae.field === 'business')) target.business = data.business || '';
      if (!(sameItem && ae.field === 'submission')) target.submission = data.submission || '';
      if (!(sameItem && ae.field === 'vacation')) target.vacation = data.vacation || '';

      return true;
    }

    // ========= ★更新ボタン方式：差分読み込み =========
    async function loadCloudForYear({ initialFull = false } = {}) {
      if (!authUser) return { updatedCount: 0, changed: false };
      const ok = await ensureFirebase();
      if (!ok) return { updatedCount: 0, changed: false };

      const startYear = getStartYear();
      const ref = cloudDaysRef(startYear);

      setSyncBadge('同期中', 'wait');

      const lastSeen = getLastSeenTs(startYear);

      let qref = ref;
      if (!initialFull && lastSeen) {
        qref = ref.where('updatedAt', '>', lastSeen).orderBy('updatedAt', 'asc');
      }

      const snap = await qref.get();

      let updatedCount = snap.size;

      let changed = false;
      let maxTs = lastSeen;

      snap.forEach(doc => {
        const data = doc.data() || {};
        const did = applyCloudDocToLocal(data);
        if (did) changed = true;

        const ts = data.updatedAt;
        if (ts && typeof ts.toMillis === 'function') {
          if (!maxTs || ts.toMillis() > maxTs.toMillis()) maxTs = ts;
        }
      });

      if (initialFull && !maxTs) {
        maxTs = firebase.firestore.Timestamp.fromMillis(Date.now());
      }
      if (maxTs) setLastSeenTs(startYear, maxTs);

      if (changed) {
        if (isEditingCell) pendingRerender = true;
        else renderSchedule();
      }

      // ========= 学校名（meta） =========
      try {
        if (initialFull || !lastSeen) {
          const metaSnap = await yearDocRef(startYear).get();
          if (metaSnap.exists) {
            const md = metaSnap.data() || {};
            if (typeof md.schoolName === 'string' && md.schoolName.trim()) {
              document.getElementById('schoolName').innerText = md.schoolName;
            }
          }
        } else {
          const ys = await roomDocRef().collection('years')
            .where('updatedAt', '>', lastSeen)
            .orderBy('updatedAt', 'asc')
            .get();

          ys.forEach(d => {
            if (d.id !== String(startYear)) return;
            const md = d.data() || {};
            if (typeof md.schoolName === 'string' && md.schoolName.trim()) {
              document.getElementById('schoolName').innerText = md.schoolName;
            }
          });
        }
      } catch (e) { console.error(e); }

      // ★予定データ本体キャッシュ（初回フル / 変更あり / 更新件数あり のときだけ保存）
      if (initialFull || changed || updatedCount > 0) {
        queueScheduleCacheSave();
      }

      setSyncBadge('同期OK', 'ok');
      return { updatedCount, changed };
    }

    // ========= 保存デバウンス =========
    async function saveDayToCloud(item) {
      if (!authUser) return;
      const ok = await ensureFirebase();
      if (!ok) return;

      const startYear = getStartYear();
      const docId = `${item.year}-${item.month}-${item.day}`;
      const ref = cloudDaysRef(startYear).doc(docId);

      const notice = (item.notice || '').trim();
      const duty = (item.duty || '').trim();
      const events = (item.events || '').trim();
      const business = (item.business || '').trim();
      const submission = (item.submission || '').trim();
      const vacation = (item.vacation || '').trim();

      const isEmpty = !notice && !duty && !events && !business && !submission && !vacation;

      if (isEmpty) {
        await ref.set({
          year: item.year,
          month: item.month,
          day: item.day,
          notice: '',
          duty: '',
          events: '',
          business: '',
          submission: '',
          vacation: '',
          isDeleted: true,
          deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedBy: authUser ? authUser.uid : null
        }, { merge: true });
        return;
      }

      await ref.set({
        year: item.year,
        month: item.month,
        day: item.day,
        notice,
        duty,
        events,
        business,
        submission,
        vacation,
        isDeleted: false,
        deletedAt: firebase.firestore.FieldValue.delete(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: authUser ? authUser.uid : null
      }, { merge: true });
    }

    async function batchSaveToCloud(items) {
      if (!authUser) return;
      const ok = await ensureFirebase();
      if (!ok) return;

      const startYear = getStartYear();
      const ref = cloudDaysRef(startYear);

      const batch = db.batch();
      items.forEach(item => {
        const docId = `${item.year}-${item.month}-${item.day}`;

        const notice = (item.notice || '').trim();
        const duty = (item.duty || '').trim();
        const events = (item.events || '').trim();
        const business = (item.business || '').trim();
        const submission = (item.submission || '').trim();
        const vacation = (item.vacation || '').trim();

        const isEmpty = !notice && !duty && !events && !business && !submission && !vacation;

        if (isEmpty) {
          batch.set(ref.doc(docId), {
            year: item.year,
            month: item.month,
            day: item.day,
            notice: '',
            duty: '',
            events: '',
            business: '',
            submission: '',
            vacation: '',
            isDeleted: true,
            deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedBy: authUser ? authUser.uid : null
          }, { merge: true });
        } else {
          batch.set(ref.doc(docId), {
            year: item.year,
            month: item.month,
            day: item.day,
            notice,
            duty,
            events,
            business,

            isDeleted: false,
            deletedAt: firebase.firestore.FieldValue.delete(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),

          }, { merge: true });

    // ★入力中は「カード単位」で debounce して保存予約（保存処理は commitSaveItem(itemId) 1回）
    function queueSave(id, field, value) {
      if (!(authUser && canEdit)) return;

      resetZoomIfNeeded();

      const item = scheduleData.find(d => d.id === id);
      if (!item) return;

      const key = _k(id, field);

      if (!_baseValue.has(key)) {
        _baseValue.set(key, norm(item[field] || ''));
      }

      const v = norm(value);
      item[field] = v;

      const base = _baseValue.get(key);

      if (v === base) {
        clearDirty(id, field);

        if (!hasDirtyForItem(id)) {
          if (_saveTimers.has(id)) {
            clearTimeout(_saveTimers.get(id));
            _saveTimers.delete(id);
          }
          _pendingItemIds.delete(id);
        }
        return;
      }

      markDirty(id, field);

      if (_saveTimers.has(id)) clearTimeout(_saveTimers.get(id));
      _saveTimers.set(id, setTimeout(async () => {
        _saveTimers.delete(id);
        await commitSaveItem(id);
      }, 3000));
    }

    async function flushAllPendingSaves() {
      if (!(authUser && canEdit)) {
        _saveTimers.forEach(t => clearTimeout(t));
        _saveTimers.clear();
        _pendingItemIds.clear();
        _dirtyKeys.clear();
        _itemDirtyCount.clear();
        return;
      }

      _saveTimers.forEach(t => clearTimeout(t));
      _saveTimers.clear();

      const items = [];
      const ids = Array.from(_pendingItemIds);
      _pendingItemIds.clear();

      ids.forEach(itemId => {
        if (!hasDirtyForItem(itemId)) return;
        const it = scheduleData.find(d => d.id === itemId);
        if (it) items.push(it);
      });

      if (items.length > 0) {
        try {
          await batchSaveToCloud(items);

          items.forEach(it => {
            _fields().forEach(f => {
              _baseValue.set(_k(it.id, f), norm(it[f] || ''));
              clearDirty(it.id, f);
            });
          });

          queueScheduleCacheSave();
        } catch (e) {
          console.error(e);
        }
      }
    }

    // ========= 最終更新表示 =========
    function _formatAgo(ms) {
      if (ms == null) return '未更新';
      const diff = Date.now() - ms;
      if (diff < 0) return 'たった今';
      const s = Math.floor(diff / 1000);
      if (s < 10) return 'たった今';
      if (s < 60) return `${s}秒前`;
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}分前`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}時間前`;
      const d = Math.floor(h / 24);
      return `${d}日前`;
    }

    function _formatDateTimeShort(ms) {
      if (ms == null) return '';
      const d = new Date(ms);
      const MM = String(d.getMonth() + 1).padStart(2, '0');
      const DD = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${MM}/${DD}\u00A0${hh}:${mm}`;
    }

      const el = document.getElementById('lastUpdateLabel');

      if (lastSyncAt == null) {
        el.textContent = '最終更新：未更新';
        return;
      }

      const ago = _formatAgo(lastSyncAt);
      const dt = _formatDateTimeShort(lastSyncAt);
      el.innerHTML = `最終更新：${ago} <span class="ml-1  text-inherit text-slate-400">(${dt})</span>`;
    }

    async function manualRefresh() {
      if (!authUser) {
        alert('ログインすると更新できます。');
        return;
      }
      if (isRefreshing) return;

      isRefreshing = true;
      setRefreshingUI(true);
      setSyncBadge('同期中', 'wait');

      try {
        try { await flushAllPendingSaves(); } catch (e) { console.error(e); }

        const result = await loadCloudForYear({ initialFull: false });
        const n = (result && Number.isFinite(result.updatedCount)) ? result.updatedCount : 0;

        lastSyncAt = Date.now();
        updateLastSyncLabel();
        startLastSyncTicker();

        renderSchedule();

        setSyncBadge('同期OK', 'ok');
        showToast({
          title: '更新しました',
          line1: '最新の予定を読み込みました。',
          line2: (n > 0) ? `${n}件の変更を反映しました。` : '前回から変更はありません。',
          kind: 'ok'
        });
      } catch (e) {
        console.error(e);
        setSyncBadge('同期失敗', 'ng');
        showToast({
          title: '更新に失敗しました',
          line1: '通信状況を確認して、もう一度「更新」を押してください。',
          line2: '',
          kind: 'ng'
        });
      } finally {
        isRefreshing = false;
        setRefreshingUI(false);
      }
    }

    // ========= 年度生成 =========
    function generateYearlyCalendar() {
      const startYear = parseInt(document.getElementById('yearInput').value, 10);
      const newScheduleData = [];
      const dows = ['日', '月', '火', '水', '木', '金', '土'];

      for (let i = 0; i < 12; i++) {
        const month = (i + 3) % 12 + 1;
        const year = month >= 4 ? startYear : startYear + 1;
        const daysInMonth = new Date(year, month, 0).getDate();

        for (let day = 1; day <= daysInMonth; day++) {
          const date = new Date(year, month - 1, day);
          const dow = dows[date.getDay()];

          newScheduleData.push({
            id: `${year}-${month}-${day}`,
            year, month, day, dow,
            // ★追加：notice
            notice: '',
            duty: '',
            events: '',
            business: '',
            submission: '',
            vacation: ''
          });
        }
      }

      scheduleData = newScheduleData;

      // ★ログイン中なら、同年度のローカルキャッシュがあれば復元（フルread回避の鍵）
      let cacheLoaded = false;
      if (authUser) {
        cacheLoaded = loadScheduleCache(startYear);
      }

      // 旧データ互換：notice が無い場合に補完
      scheduleData.forEach(it => { if (typeof it.notice !== 'string') it.notice = ''; });

      renderSchedule();
      applyEditLockToDOM();
      updatePrintTitle();

      return cacheLoaded;
    }

    // ========= タブ別：検索対象フィールド切替（検索語は共通） =========
    function buildSearchTextForItem(item) {
      if (!item) return '';

      if (currentTab === 'notice') return String(item.notice || '');
      if (currentTab === 'school') return String(item.events || '');
      if (currentTab === 'business') return String(item.business || '');
      if (currentTab === 'submission') return String(item.submission || '');
      if (currentTab === 'vacation') return String(item.vacation || '');

      return (
        String(item.notice || '') + '\n' +
        String(item.events || '') + '\n' +
        String(item.business || '') + '\n' +
        String(item.submission || '') + '\n' +
        String(item.vacation || '') + '\n' +
        String(item.duty || '') + '\n'
      );
    }

    // ========= ★検索ハイライト（閲覧時のみ） =========
    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function escapeRegExp(s) {
      return String(s ?? '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
    function nl2br(s) {
      return String(s ?? '').replace(/\n/g, '<br>');
    }
    function highlightHtml(text, query) {
      const t = String(text ?? '');
      const q = String(query ?? '').trim();
      if (!q) return nl2br(escapeHtml(t));

      const safeText = escapeHtml(t);
      const safeQuery = escapeHtml(q);
      const re = new RegExp(escapeRegExp(safeQuery), 'gi');

      return nl2br(
        safeText.replace(re, (m) => `<mark class="bg-yellow-200 rounded px-0.5">${m}</mark>`)
      );
    }

              <div class="text-base whitespace-pre-wrap leading-relaxed editable h-full" contenteditable="true"
                onfocus="onCellFocus('${item.id}', '${field}', this.innerText)"
                oninput="queueSave('${item.id}', '${field}', this.innerText)">${fieldVal}</div>
            </div>
          `;
        }

        card.innerHTML = dateSection + contentHtml;
        container.appendChild(card);
      });

      applyEditLockToDOM();
    }

    // ========= タブ =========
    function switchTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        const active = btn.dataset.tab === tabId;
        btn.className = `tab-btn py-3 border-b-2 text-sm font-medium transition-all ${active ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`;
      });
      renderSchedule();
    }

    // ========= 検索 =========
    function setupSearch() {
      const input = document.getElementById('searchInput');
      if (!input) return;

      input.addEventListener('focus', () => {
        _zoomResetDoneForThisFocus = false;
      });

      input.addEventListener('blur', () => {
        forceResetZoom();
      });

      input.oninput = (e) => {
        globalSearchQuery = e.target.value || '';
        updateClearButton();
        renderSchedule();
      };
    }

    // ========= CSV =========
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (char === '"') {
          if (inQuotes && text[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (char === ',' && !inQuotes) {
          row.push(field);
          field = '';
          continue;
        }

        if (!inQuotes && (char === '\n' || char === '\r')) {
          if (char === '\r' && text[i + 1] === '\n') i++;
          row.push(field);
          rows.push(row);
          row = [];
          field = '';
          continue;
        }

        field += char;
      }

      row.push(field);
      rows.push(row);

      const cleaned = rows
        .map(r => r.map(c => String(c ?? '')))
        .filter(r => r.some(c => String(c).trim() !== ''));

      if (cleaned.length > 0 && cleaned[0].length > 0) {
        cleaned[0][0] = cleaned[0][0].replace(/^\uFEFF/, '');
      }

      return cleaned;
    }

    function pick(before, candidateRaw) {
      const c = norm(candidateRaw);
      return c ? c : before;
    }

    // ★B) UTF-8 → ダメなら Shift-JIS（iOSの文字化けもヘッダー判定でフォールバック）
    function readFileAsText(file, encoding) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result || ''));
        r.onerror = () => reject(r.error || new Error('FileReader error'));
        r.readAsText(file, encoding);
      });
    }

    // ★お知らせ対応：旧CSV（お知らせ列なし）も読める
    async function importCSV(input) {
      if (!(authUser && canEdit)) {
        alert('CSVインポートは「ログイン＋編集モード」の時だけできます。');
        input.value = '';
        return;
      }

      const file = input.files[0];
      if (!file) return;

      try {
        // ① まずUTF-8で読む
        let text = await readFileAsText(file, 'UTF-8');
        let table = parseCSV(String(text || ''));

        if (table.length < 2) { alert('CSVにデータ行がありません。'); return; }

        let headerLine = table[0].map(v => String(v ?? '').trim());

        // ★期待ヘッダー（順序は問わない・存在すれば読む）
        // ['月','日','曜日','日直','予定','出張','提出物','お知らせ','休暇']
        const mapping = {
          '月': -1,
          '日': -1,
          '曜日': -1,      // あっても使わない（あれば読み飛ばし）
          '日直': -1,
          '予定': -1,
          '出張': -1,
          '提出物': -1,
          'お知らせ': -1,  // ★追加
          '休暇': -1
        };

        headerLine.forEach((h, i) => {
          const cleanH = String(h ?? '').trim();
          if (Object.prototype.hasOwnProperty.call(mapping, cleanH)) mapping[cleanH] = i;
        });

        // ② UTF-8で「月」「日」が取れないなら Shift-JIS で読み直す
        if (mapping['月'] === -1 || mapping['日'] === -1) {
          text = await readFileAsText(file, 'Shift-JIS');
          table = parseCSV(String(text || ''));

          if (table.length < 2) { alert('CSVにデータ行がありません。'); return; }

          headerLine = table[0].map(v => String(v ?? '').trim());

          // mapping を作り直す（再初期化）
          mapping['月'] = mapping['日'] = mapping['曜日'] = mapping['日直'] =
          mapping['予定'] = mapping['出張'] = mapping['提出物'] = mapping['お知らせ'] = mapping['休暇'] = -1;

          headerLine.forEach((h, i) => {
            const cleanH = String(h ?? '').trim();
            if (Object.prototype.hasOwnProperty.call(mapping, cleanH)) mapping[cleanH] = i;
          });
        }

        if (mapping['月'] === -1 || mapping['日'] === -1) {
          alert('CSVのヘッダーに「月」「日」が見つかりませんでした。');
          return;
        }

        const dataRows = table.slice(1);
        let count = 0, skipped = 0;
        const startYear = getStartYear();
        const touched = [];

        dataRows.forEach(colsRaw => {
          const cols = colsRaw.map(v => String(v ?? ''));
          const m = parseInt(String(cols[mapping['月']] ?? '').trim(), 10);
          const d = parseInt(String(cols[mapping['日']] ?? '').trim(), 10);
          if (!Number.isFinite(m) || !Number.isFinite(d)) { skipped++; return; }

          const y = (m >= 4) ? startYear : startYear + 1;
          const target = scheduleData.find(item => item.year === y && item.month === m && item.day === d);
          if (!target) { skipped++; return; }

          const before = {
            notice: norm(target.notice),
            duty: norm(target.duty),
            events: norm(target.events),
            business: norm(target.business),
            submission: norm(target.submission),
            vacation: norm(target.vacation),
          };

          const next = { ...before };

          if (mapping['日直'] !== -1) next.duty = pick(before.duty, cols[mapping['日直']]);
          if (mapping['予定'] !== -1) next.events = pick(before.events, cols[mapping['予定']]);
          if (mapping['出張'] !== -1) next.business = pick(before.business, cols[mapping['出張']]);
          if (mapping['提出物'] !== -1) next.submission = pick(before.submission, cols[mapping['提出物']]);
          // ★追加：お知らせ（列が無ければ変更しない）
          if (mapping['お知らせ'] !== -1) next.notice = pick(before.notice, cols[mapping['お知らせ']]);
          if (mapping['休暇'] !== -1) next.vacation = pick(before.vacation, cols[mapping['休暇']]);

          const changed =
            next.notice !== before.notice ||
            next.duty !== before.duty ||
            next.events !== before.events ||
            next.business !== before.business ||
            next.submission !== before.submission ||
            next.vacation !== before.vacation;

          if (!changed) return;

          target.notice = next.notice;
          target.duty = next.duty;
          target.events = next.events;
          target.business = next.business;
          target.submission = next.submission;
          target.vacation = next.vacation;

          touched.push(target);
          count++;
        });

        if (count > 0) {
          renderSchedule();
          try { await batchSaveToCloud(touched); } catch (err) { console.error(err); }

          // ★A) baseline更新を正しく（csvEscapeを使わない）
          touched.forEach(it => {
            _fields().forEach(f => {
              _baseValue.set(_k(it.id, f), norm(it[f] || '')); // baseline更新
              clearDirty(it.id, f);                             // dirty解除
            });

            // その日を「未保存」扱いにしない（安全）
            _pendingItemIds.delete(it.id);

            // その日に既存のdebounceが残っていたら止める（安全）
            if (_saveTimers.has(it.id)) {
              clearTimeout(_saveTimers.get(it.id));
              _saveTimers.delete(it.id);
            }
          });

          queueScheduleCacheSave();

          alert(`${count}件の予定を更新しました。${skipped ? `（スキップ ${skipped}行）` : ''}`);
        } else {
          alert('有効なデータが見つかりませんでした。');
        }
      } catch (e) {
        console.error(e);
        alert('CSVの読み込みに失敗しました。別の形式（UTF-8/Shift-JIS）で保存し直してお試しください。');
      } finally {
        input.value = '';
      }
    }

    function csvEscape(v) {
      const s = String(v ?? '');
      if (/[",\r\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
      return s;
    }

    // ★お知らせ対応：ヘッダー固定（指定順）
    function exportCSV() {
      if (!authUser) {
        alert('CSVエクスポートはログイン後にできます。');
        return;
      }

      const startYear = getStartYear();

      const rows = [...scheduleData].sort((a, b) => {
        if (a.year !== b.year) return a.year - b.year;
        if (a.month !== b.month) return a.month - b.month;
        return a.day - b.day;
      });

      // ★指定ヘッダー順
      const header = ['月','日','曜日','日直','予定','出張','提出物','お知らせ','休暇'];
      const lines = [header.map(csvEscape).join(',')];

      rows.forEach(it => {
        const line = [
          it.month,
          it.day,
          it.dow || '',
          it.duty || '',
          it.events || '',
          it.business || '',
          it.submission || '',
          it.notice || '',   // ★追加
          it.vacation || ''
        ].map(csvEscape).join(',');
        lines.push(line);
      });

      const csvText = '\uFEFF' + lines.join('\r\n');
      const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `schedule_${startYear}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ========= ログインUI =========
    function openLoginModal() {
      const lastId = localStorage.getItem(LAST_ID_KEY) || '';
      if (!document.getElementById('idInput').value.trim()) document.getElementById('idInput').value = lastId;
      document.getElementById('loginModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('idInput').focus(), 0);
    }
    function closeLoginModal() {
      document.getElementById('loginModal').classList.add('hidden');
    }

    async function createNewAccount() {
      const id = document.getElementById('idInput').value.trim();
      const pass = document.getElementById('passInput').value;

      const code = (document.getElementById('createCodeInput')?.value || '').trim();

      const email = toEmailFromId(id);
      if (!email) { alert('IDは英数・記号 . _ - のみで入力してください。'); return; }
      if (!pass || pass.length < 6) { alert('Passwordは6文字以上で入力してください。'); return; }

      if (!code) { alert('ID新規作成コードを入力してください。'); return; }
      if (code !== FIXED_CREATE_CODE) { alert('ID新規作成コードが違います。'); return; }

      try {
        setSyncBadge('作成中', 'wait');
        await firebase.auth().createUserWithEmailAndPassword(email, pass);

        localStorage.setItem(LAST_ID_KEY, id);

        const cc = document.getElementById('createCodeInput');
        if (cc) cc.value = '';

        closeLoginModal();
      } catch (e) {
        console.error(e);
        setSyncBadge('未接続', 'idle');
        alert(friendlyAuthError(e, 'ID新規作成'));
      }
    }

    async function loginWithIdPass() {
      const id = document.getElementById('idInput').value.trim();
      const pass = document.getElementById('passInput').value;

      const email = toEmailFromId(id);
      if (!email) { alert('IDは英数・記号 . _ - のみで入力してください。'); return; }
      if (!pass || pass.length < 6) { alert('Passwordは6文字以上で入力してください。'); return; }

      try {
        setSyncBadge('接続中', 'wait');
        await firebase.auth().signInWithEmailAndPassword(email, pass);
        localStorage.setItem(LAST_ID_KEY, id);
        closeLoginModal();
      } catch (e) {
        console.error(e);
        setSyncBadge('未接続', 'idle');
        alert(friendlyAuthError(e, 'ログイン'));
      }
    }

    async function logout() {
      try {
        await flushAllPendingSaves();
        await firebase.auth().signOut();
        closeLoginModal();
      } catch (e) { console.error(e); }
    }

    function toggleMode() {
      if (!authUser) {
        canEdit = false;
        setModeBadge();
        applyEditLockToDOM();
        alert('モード切替はログイン後にできます。');
        return;
      }
      canEdit = !canEdit;
      setModeBadge();
      applyEditLockToDOM();
    }

    // ========= 起動 =========
    window.onload = init;
  </script>
</body>
